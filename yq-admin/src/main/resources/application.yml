server:
  port: 8080
  servlet:
    context-path: /yq-admin

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  logging:
    path: ${APP_LOG_PATH:logs}
  permission-sync:
    enabled: true
  role-init:
    enabled: true
  admin-permission-init:
    enabled: true
    role-code: ${APP_ADMIN_ROLE_CODE:ADMIN}
  user:
    default-role-code: ${APP_DEFAULT_USER_ROLE_CODE:LECTURER}

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: com.itcjy.emp.controller
  paths-to-match: /emp/**

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.itcjy.emp.pojo.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
