server:
  port: 8080
  servlet:
    context-path: /yq-admin

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

app:
  alipay:
    app-id: ${ALIPAY_APP_ID:9021000165644710}
    private-key: ${ALIPAY_PRIVATE_KEY:}
    alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
    server-url: ${ALIPAY_SERVER_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
    notify-url: ${ALIPAY_NOTIFY_URL:http://yd465a24.natappfree.cc/yq-admin/pay/alipay/notify}
    return-url: ${ALIPAY_RETURN_URL:http://localhost:5174/}
    sign-type: RSA2
    charset: UTF-8
    format: json
  oss:
    endpoint: ${OSS_ENDPOINT:oss-cn-hangzhou.aliyuncs.com}
    access-key-id: ${OSS_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:your-access-key-secret}
    bucket-name: ${OSS_BUCKET_NAME:yq-platform}
    upload-expire-seconds: ${OSS_UPLOAD_EXPIRE:300}
    download-expire-seconds: ${OSS_DOWNLOAD_EXPIRE:3600}
  logging:
    path: ${APP_LOG_PATH:logs}
  permission-sync:
    enabled: true
  role-init:
    enabled: true
  admin-permission-init:
    enabled: true
    role-code: ${APP_ADMIN_ROLE_CODE:ADMIN}
  user:
    default-role-code: ${APP_DEFAULT_USER_ROLE_CODE:LECTURER}
  jwt:
    secret: ${JWT_SECRET:yanque-dev-jwt-secret-please-change-32bytes}
    expire-millis: ${JWT_EXPIRE_MILLIS:7200000}
    issuer: ${JWT_ISSUER:yq-admin}
    header-name: Authorization
    token-prefix: 'Bearer '

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan:
    - com.itcjy.emp.controller
    - com.itcjy.stu.controller
    - com.itcjy.emp.controller.pay
  paths-to-match:
    - /emp/**
    - /stu/**
    - /pay/**

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  type-aliases-package: com.itcjy.emp.pojo.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
